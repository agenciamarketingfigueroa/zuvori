name = "zuvori-private"
main = "worker/index.js"
compatibility_date = "2026-10-15"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "ZUVORI_DATA"
id = "SUBSTITUA_PELO_ID_DO_KV"

[[ratelimits]]
name = "LOGIN_RATE"
namespace_id = "1701"

[ratelimits.simple]
limit = 5
period = 60
